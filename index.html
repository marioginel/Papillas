<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuaderno de Papillas</title>
<meta name="theme-color" content="#3F7A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Papillas">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: app de una columna para móvil (máx 560px), cabecera fija arriba, barra de pestañas abajo, hojas deslizantes para formularios */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --sunk:#E8ECE3; --line:#D8DED2;
  --ink:#1D2620; --muted:#5F6C63; --faint:#8C978F;
  --accent:#3F7A3A; --accent-ink:#FFFFFF; --accent-soft:#E2EEDB;
  --milk:#3A6DB8; --solid:#C47A12; --poop:#8B5FB0;
  --good:#2E7D4F; --warn:#B7791F; --bad:#C0392B;
  --good-soft:#DFF0E5; --warn-soft:#F8EBD3; --bad-soft:#F7DEDA;
  --shadow:0 1px 2px rgba(29,38,32,.06),0 6px 20px rgba(29,38,32,.06);
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121612; --surface:#1B211B; --sunk:#242C23; --line:#2F392E;
  --ink:#E6ECE3; --muted:#A1AD9F; --faint:#77837A;
  --accent:#7DBE6C; --accent-ink:#0F1A0D; --accent-soft:#25341F;
  --milk:#5E8FD8; --solid:#B87D24; --poop:#9E7AC8;
  --good:#6CC28F; --warn:#E0A84B; --bad:#EE7F72;
  --good-soft:#1C3326; --warn-soft:#382C17; --bad-soft:#3C201D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121612; --surface:#1B211B; --sunk:#242C23; --line:#2F392E;
  --ink:#E6ECE3; --muted:#A1AD9F; --faint:#77837A;
  --accent:#7DBE6C; --accent-ink:#0F1A0D; --accent-soft:#25341F;
  --milk:#5E8FD8; --solid:#B87D24; --poop:#9E7AC8;
  --good:#6CC28F; --warn:#E0A84B; --bad:#EE7F72;
  --good-soft:#1C3326; --warn-soft:#382C17; --bad-soft:#3C201D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.num{font-variant-numeric:tabular-nums}

.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px;font-weight:900}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;font-weight:900;letter-spacing:-.01em}
.top .age{color:var(--muted);font-size:13px}
.top .who{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font:800 16px var(--f-display);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:17px;font-weight:800}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:14px}

.daynav{display:flex;align-items:center;gap:8px}
.daynav .lbl{flex:1;text-align:center;font:800 17px var(--f-display)}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:18px}
.daynav button:disabled{opacity:.35;cursor:default}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font:900 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .v small{font:700 12px var(--f-body);color:var(--muted);margin-left:2px}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-milk{background:var(--milk)}.d-solid{background:var(--solid)}.d-poop{background:var(--poop)}

.plan .slot{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.plan .slot:first-of-type{border-top:0}
.slot .t{font:700 13px var(--f-mono);color:var(--muted);padding-top:2px}
.slot .n{font-weight:700}
.slot .tg{font-size:13px;color:var(--muted)}
.slot .got{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.p-milk{background:color-mix(in srgb,var(--milk) 16%,transparent);color:var(--ink)}
.p-solid{background:color-mix(in srgb,var(--solid) 18%,transparent);color:var(--ink)}
.p-poop{background:color-mix(in srgb,var(--poop) 18%,transparent);color:var(--ink)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-plain{background:var(--sunk);color:var(--muted)}
.p-new{background:var(--accent-soft);color:var(--accent)}
.weekbar{display:flex;gap:4px;margin-top:8px}
.weekbar i{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.weekbar i.on{background:var(--accent)}

.tl{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:48px 4px 1fr auto;gap:10px;align-items:stretch;padding:10px 4px;border:0;background:none;text-align:left;border-top:1px solid var(--line);width:100%}
.ent:first-child{border-top:0}
.ent .t{font:700 13px var(--f-mono);color:var(--muted);padding-top:2px}
.ent .bar{border-radius:2px}
.ent .ttl{font-weight:700}
.ent .sub{font-size:13px;color:var(--muted)}
.ent .rt{align-self:center}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

details.tips summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.tips summary::after{content:"+";color:var(--muted);font-weight:700}
details.tips[open] summary::after{content:"–"}
details.tips ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scroller{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.scroller .chips{flex-wrap:nowrap}

.rlist{display:flex;flex-direction:column;gap:10px}
.rc{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;box-shadow:var(--shadow)}
.rc .rn{font:800 16px var(--f-display)}
.rc .rm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rc .stars{font-size:12px;color:var(--muted)}

.freezer .fz{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.freezer .fz:first-of-type{border-top:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.step .q{min-width:26px;text-align:center;font:900 17px var(--f-display);font-variant-numeric:tabular-nums}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,10,.45)}
.sheet-panel{position:relative;width:100%;max-width:600px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-head h2{flex:1;font-size:21px;font-weight:900}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lab{font-size:13px;font-weight:700;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea.inp{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:800 15px var(--f-display);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* recipe detail */
.rd-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line)}
.ing li:first-child{border-top:0}
.ing .q{font:700 14px var(--f-mono);white-space:nowrap}
.ing .fix{color:var(--warn);font-size:12px;display:block}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.st{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st .nb{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:900 13px var(--f-display);background:none;padding:0}
.st.done{opacity:.55}
.st.done .nb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st .tx{min-width:0}
.tm{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:700 13px var(--f-mono);background:var(--sunk);border-radius:8px;padding:4px 8px}
.timer{border:0;margin-left:6px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 9px;font:800 13px var(--f-mono)}
.timer.run{background:var(--warn);color:#fff}
.note{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}
.note+.note{margin-top:8px}

/* evolution */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--f-body);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px 6px 0}
td{padding:8px 8px 8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}

/* foods */
.fgrid{display:flex;flex-wrap:wrap;gap:6px}
.food{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.food.probado{background:var(--good-soft);border-color:transparent}
.food.prueba{background:var(--warn-soft);border-color:transparent}
.food.reaccion{background:var(--bad-soft);border-color:transparent}
.food .mk{font-size:12px;font-weight:700}
.food.probado .mk{color:var(--good)}.food.prueba .mk{color:var(--warn)}.food.reaccion .mk{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form class="card" id="loginForm">
    <div><div class="eyebrow">Alimentación complementaria</div><h1>Cuaderno de Papillas</h1></div>
    <div class="field"><label for="lgE">Email</label><input class="inp" id="lgE" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lgP">Contraseña</label><input class="inp" id="lgP" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" id="lgBtn">Entrar</button>
    <div class="small" id="lgErr" style="color:var(--bad)"></div>
  </form>
</div>

<div id="app" hidden>
<header class="top"><div class="top-in">
  <div class="who"><h1 id="babyName">Cuaderno de Papillas</h1><div class="age num" id="babyAge">&nbsp;</div></div>
  <button class="iconbtn" id="btnSettings" aria-label="Ajustes del bebé"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main>
  <div id="statusBanner" class="banner" hidden></div>
  <section class="view" id="v-hoy"></section>
  <section class="view" id="v-recetas" hidden></section>
  <section class="view" id="v-evol" hidden></section>
  <section class="view" id="v-alim" hidden></section>
</main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Registrar</button>

<nav class="tabs"><div class="tabs-in">
  <button class="tab" data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button class="tab" data-tab="recetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>Recetas</button>
  <button class="tab" data-tab="evol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Evolución</button>
  <button class="tab" data-tab="alim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21c-4 0-7-3-7-7 0-3 2-6 4-7 1 1 2 1 3 1s2 0 3-1c2 1 4 4 4 7 0 4-3 7-7 7z"/><path d="M12 8c0-2 1-4 3-5"/></svg>Alimentos</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" id="sheetBg"></div><div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="tip" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script>
/* ================= DATOS DE REFERENCIA ================= */
const CATALOGO = {
  "Verduras":["Calabacín","Patata","Zanahoria","Judía verde","Boniato","Calabaza","Puerro","Guisantes","Brócoli","Pimiento rojo","Berenjena","Nabo","Coliflor","Champiñón","Tomate","Cebolla","Ajo","Chirivía"],
  "Frutas":["Plátano","Aguacate","Manzana","Pera","Kiwi","Dátil","Arándanos","Frambuesa","Mango","Melocotón","Fresa","Naranja","Sandía"],

function racionPara(r){
  const e=edad(cfg().nacimiento),b=RACIONES.find(x=>e.m<x.hasta)||RACIONES[RACIONES.length-1];
  const fija=RACION_FIJA[r.id];
  const rg=b[r.cat]||null;
  let plan=null;const pf=planFor(dayKey(new Date()));
  if(pf&&!pf.extra&&pf.p.s[r.cat]){const s=pf.p.s[r.cat];
    if(s.g)plan=`Plan semana ${pf.i+1}: ${s.g[0]===s.g[1]?s.g[0]:s.g[0]+"-"+s.g[1]} g`;
    else if(!s.sol)plan=`Plan semana ${pf.i+1}: aún no toca sólido en la ${MOM_N[r.cat].toLowerCase()}`;}
  return {fija,rg,lbl:b.lbl,plan,mid:rg?(rg[0]+rg[1])/2:null};
}
function racionTxt(r){const x=racionPara(r);if(x.fija)return x.fija;return x.rg?x.rg[0]+"-"+x.rg[1]+" g":""}
function rendimiento(r,mult){if(r.mia||!r.ing||RACION_FIJA[r.id])return null;
  const tot=r.ing.filter(i=>i[2]==="g"||i[2]==="ml").reduce((a,i)=>a+i[1],0)*mult;
  if(tot<200)return null;const est=Math.round(tot*0.9);const x=racionPara(r);if(!x.mid)return null;
  return {g:est,n:Math.max(1,Math.floor(est/x.mid))}}

/* ================= UTILIDADES ================= */
function $(s,r=document){return r.querySelector(s)}
function $$(s,r=document){return [...r.querySelectorAll(s)]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function dayKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fromKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return dayKey(d)}
function hm(ts){const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}
function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"],MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDay(k){const d=fromKey(k);return DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()]}
function localInput(ts){const d=new Date(ts);return dayKey(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function momentoAuto(ts){const d=new Date(ts),h=d.getHours()+d.getMinutes()/60;
  if(h<6)return"madrugada";if(h<11)return"desayuno";if(h<15.5)return"comida";if(h<18.5)return"merienda";if(h<23)return"cena";return"madrugada"}
function edad(nac,ref=new Date()){
  const b=fromKey(nac);let m=(ref.getFullYear()-b.getFullYear())*12+(ref.getMonth()-b.getMonth());
  let d=ref.getDate()-b.getDate();if(d<0){m--;const prev=new Date(ref.getFullYear(),ref.getMonth(),0).getDate();d+=prev}
  return {m,d}}
function frac(q){const map={0.25:"¼",0.5:"½",0.75:"¾"};const w=Math.floor(q),r=Math.round((q-w)*100)/100;
  if(r===0)return String(w);if(map[r])return (w?w:"")+map[r];return String(Math.round(q*10)/10).replace(".",",")}
function fmtQty(q,u,mult){if(q==null)return u||"";const v=q*mult;
  if(u==="g"||u==="ml")return Math.round(v)+" "+u;
  if(u==="ud")return frac(v);return frac(v)+" "+u}
function semanaPlan(k){const i=Math.floor((fromKey(k)-fromKey(cfg().planInicio))/864e5/7);return i}
function planFor(k){const i=semanaPlan(k);if(i<0)return null;return {i,p:PLAN[Math.min(i,3)],extra:i>3}}
function allRecetas(){return RECETAS.concat(S.recDb.map(r=>{const t=CAT_OLD[r.tipo]||r.tipo;return {...r,cat:CAT_LIST.includes(t)?t:"comida",mia:true}}))}
function recById(id){return allRecetas().find(r=>r.id===id)}
function foodState(n){const a=S.alim[slug(n)];if(!a)return"pendiente";
  if(a.estado==="prueba"&&a.inicio){const d=Math.floor((fromKey(dayKey(new Date()))-fromKey(a.inicio))/864e5);if(d>=3)return"probado?"}
  return a.estado||"pendiente"}

    if(e.acept&&ACEPT[e.acept])rt=`<span class="pill ${ACEPT[e.acept][1]}">${ACEPT[e.acept][0]}</span>`}

}

function startTimer(btn,min,recipe){
  if(timer){clearInterval(timer.iv);if(timer.btn)timer.btn.classList.remove("run");if(timer.btn===btn||timer.key===btn.dataset.st){const b=timer.btn;timer=null;if(b)b.textContent="▶ "+b.dataset.min+":00";return}}
  let ctx=null;try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  const end=Date.now()+min*60000;
  timer={end,btn,key:btn.dataset.st,recipe,ctx,iv:setInterval(tick,500)};btn.classList.add("run");tick();
  function tick(){const left=Math.max(0,Math.round((timer.end-Date.now())/1000));const b=timer.btn&&document.contains(timer.btn)?timer.btn:$(`.timer[data-st="${timer.key}"]`);
    if(b){timer.btn=b;b.textContent="■ "+Math.floor(left/60)+":"+pad(left%60)}
    if(left<=0){clearInterval(timer.iv);beep(timer.ctx);toast("¡Tiempo! "+recipe);if(b){b.classList.remove("run");b.textContent="✓ hecho"}timer=null}}
}
function beep(ctx){if(!ctx)return;try{[0,0.35,0.7].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.25,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.3)})}catch(e){}}

function dayAgg(k){const es=entriesOf(k);
  return {k,es,leche:es.filter(e=>e.tipo==="biberon").reduce((a,e)=>a+(+e.ml||0),0),
   sol:es.filter(e=>e.tipo==="solido").reduce((a,e)=>a+(+e.g||0),0),
   tomas:es.filter(e=>e.tipo==="solido").length,
   bien:es.filter(e=>e.tipo==="solido"&&e.acept==="bien").length,
   reg:es.filter(e=>e.tipo==="solido"&&e.acept==="regular").length,
   rech:es.filter(e=>e.tipo==="solido"&&e.acept==="rechazo").length,
   liq:es.filter(e=>e.tipo==="deposicion"&&e.cons==="liquida").length,
   dep:es.filter(e=>e.tipo==="deposicion").length}}
function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(days,key,color,unit,band){
  const W=360,H=150,L=36,R=8,T=12,B=22,iw=W-L-R,ih=H-T-B;
  const vals=days.map(d=>d[key]);const mx=niceMax(Math.max(...vals,band?band[1]:0));
  const bw=iw/days.length,gap=Math.max(1.5,bw*0.28);
  const y=v=>T+ih-(v/mx)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0,0.5,1].forEach(f=>{const v=mx*f;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`});
  if(band)s+=`<rect x="${L}" width="${iw}" y="${y(band[1])}" height="${y(band[0])-y(band[1])}" fill="var(--accent)" opacity=".12"/><text x="${W-R}" y="${y(band[1])-4}" text-anchor="end" style="fill:var(--accent);font-weight:700">objetivo ${band[0]}-${band[1]}</text>`;
  const step=Math.ceil(days.length/7);
  days.forEach((d,i)=>{const x=L+i*bw+gap/2,w=bw-gap,v=d[key];
    if(v>0){const yy=y(v),h=T+ih-yy,r=Math.min(3,w/2,h);s+=`<path d="M${x},${T+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+w-r} Q${x+w},${yy} ${x+w},${yy+r} V${T+ih} Z" fill="${color}"/>`}
    s+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${fmtDay(d.k)}: ${v} ${unit}"/>`;
    if((days.length-1-i)%step===0)s+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${fromKey(d.k).getDate()}</text>`});
  return s+`</svg>`;
}
function dotPlot(days){
  const W=360,L=50,R=8,T=18,rowH=15,H=T+days.length*rowH+8,iw=W-L-R;const x=h=>L+h/24*iw;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0,6,12,18,24].forEach(h=>{s+=`<line class="grid" x1="${x(h)}" x2="${x(h)}" y1="${T-4}" y2="${H-6}"/><text x="${x(h)}" y="${T-8}" text-anchor="middle">${pad(h)}h</text>`});
  days.slice().reverse().forEach((d,i)=>{const cy=T+i*rowH+rowH/2;
    s+=`<text x="${L-6}" y="${cy+4}" text-anchor="end">${DIAS[fromKey(d.k).getDay()]} ${fromKey(d.k).getDate()}</text>`;
    d.es.forEach(e=>{const t=new Date(e.ts),h=t.getHours()+t.getMinutes()/60,cx=x(h);
      const lab=e.tipo==="biberon"?`Biberón ${e.ml} ml`:e.tipo==="solido"?`Sólido ${e.g||"?"} g`:`Deposición ${CONS[e.cons]?CONS[e.cons][0].toLowerCase():""}`;
      const tip=`${hm(e.ts)} · ${lab}`;
      if(e.tipo==="deposicion")s+=`<rect x="${cx-3.5}" y="${cy-3.5}" width="7" height="7" transform="rotate(45 ${cx} ${cy})" fill="var(--poop)" stroke="var(--surface)" stroke-width="1.5" data-tip="${esc(tip)}"/>`;
      else s+=`<circle cx="${cx}" cy="${cy}" r="${e.tipo==="biberon"?4.5:4}" fill="${e.tipo==="biberon"?"var(--milk)":"var(--solid)"}" stroke="var(--surface)" stroke-width="1.5" data-tip="${esc(tip)}"/>`;
      s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="transparent" data-tip="${esc(tip)}"/>`})});
  return s+`</svg>`;
}
function renderEvol(){
  const N=S.evolN,today=dayKey(new Date());
  const days=[];for(let i=N-1;i>=0;i--)days.push(dayAgg(addDays(today,-i)));
  const act=days.filter(d=>d.es.length);
  const chips=`<div class="chips" role="group" aria-label="Periodo">${[7,14,30].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${N===n}">${n} días</button>`).join("")}</div>`;
  if(!act.length){$("#v-evol").innerHTML=chips+`<div class="card empty"><b>Todavía no hay datos</b>Cuando registréis biberones y comidas unos días, aquí veréis cómo baja la leche y suben los sólidos, a qué horas come y qué recetas acepta mejor.</div>`;bindEvol();return}
  const avg=(f)=>Math.round(act.reduce((a,d)=>a+d[f],0)/act.length);
  const tomas=act.reduce((a,d)=>a+d.tomas,0),bien=act.reduce((a,d)=>a+d.bien,0);
  const liq7=days.slice(-7).reduce((a,d)=>a+d.liq,0);
  // tendencia: primera mitad vs segunda
  const half=Math.floor(act.length/2);let trend="";
  if(act.length>=4){const a1=act.slice(0,half),a2=act.slice(half);const m=(arr,f)=>arr.reduce((a,d)=>a+d[f],0)/arr.length;
    const dl=Math.round(m(a2,"leche")-m(a1,"leche")),ds=Math.round(m(a2,"sol")-m(a1,"sol"));
    trend=`<div class="note">Comparando la primera y la segunda mitad del periodo: leche <strong class="num">${dl>0?"+":""}${dl} ml/día</strong>, sólidos <strong class="num">${ds>0?"+":""}${ds} g/día</strong>.${dl<0&&ds>0?" Va en la buena dirección.":""}</div>`}
  // recetas
  const rs={};S.reg.filter(e=>e.tipo==="solido"&&e.dia>=days[0].k).forEach(e=>{const key=e.recetaId||("txt:"+(e.desc||"Otro"));
    const o=rs[key]||(rs[key]={n:e.recetaId?(recById(e.recetaId)||{}).n||"Receta":(e.desc||"Otro"),c:0,g:0,gc:0,b:0,r:0});o.c++;if(+e.g){o.g+=+e.g;o.gc++}if(e.acept==="bien")o.b++;if(e.acept==="rechazo")o.r++});
  const rows=Object.values(rs).sort((a,b)=>(b.b/b.c)-(a.b/a.c)||b.c-a.c);
  // horarios medios
  const hora=(tipo,mom)=>{const l=S.reg.filter(e=>e.tipo===tipo&&e.momento===mom&&e.dia>=days[0].k);if(!l.length)return null;const mins=l.map(e=>{const d=new Date(e.ts);return d.getHours()*60+d.getMinutes()});const m=Math.round(mins.reduce((a,b)=>a+b,0)/mins.length);return pad(Math.floor(m/60))+":"+pad(m%60)};
  const hrs=MOMENTOS.map(m=>{const b=hora("biberon",m),s=hora("solido",m);return (b||s)?`<tr><td>${MOM_N[m]}</td><td class="r num">${s||"—"}</td><td class="r num">${b||"—"}</td></tr>`:""}).join("");
  $("#v-evol").innerHTML=chips+`
   <div class="kpis">
    <div class="stat"><div class="k"><span class="dot d-milk"></span>Leche media</div><div class="v">${avg("leche")}<small>ml/día</small></div></div>
    <div class="stat"><div class="k"><span class="dot d-solid"></span>Sólidos medios</div><div class="v">${avg("sol")}<small>g/día</small></div></div>
    <div class="stat"><div class="k">Tomas bien aceptadas</div><div class="v">${tomas?Math.round(bien/tomas*100):0}<small>% de ${tomas}</small></div></div>
    <div class="stat"><div class="k"><span class="dot d-poop"></span>Deposiciones líquidas</div><div class="v">${liq7}<small>últimos 7 días</small></div></div>
   </div>
   ${trend}
   <div class="card chart"><div class="sec-h"><h2>Leche al día</h2><span class="small muted">ml</span></div><div style="margin-top:8px">${barChart(days,"leche","var(--milk)","ml",[600,700])}</div></div>
   <div class="card chart"><div class="sec-h"><h2>Sólidos al día</h2><span class="small muted">g</span></div><div style="margin-top:8px">${barChart(days,"sol","var(--solid)","g")}</div></div>
   <div class="card chart"><div class="sec-h"><h2>Horarios</h2></div>
    <div class="legend" style="margin:6px 0 8px"><span><span class="dot d-milk"></span>Biberón</span><span><span class="dot d-solid"></span>Sólido</span><span><span class="dot d-poop" style="border-radius:1px;transform:rotate(45deg)"></span>Deposición</span></div>
    <div class="tbl-wrap">${dotPlot(days)}</div>
    ${hrs?`<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Hora media</th><th class="r">Sólido</th><th class="r">Biberón</th></tr></thead><tbody>${hrs}</tbody></table></div>`:""}</div>
   ${rows.length?`<div class="card"><div class="sec-h"><h2>Qué acepta mejor</h2></div><div class="tbl-wrap" style="margin-top:6px"><table><thead><tr><th>Receta</th><th class="r">Veces</th><th class="r">Media</th><th class="r">Bien</th></tr></thead><tbody>
     ${rows.map(o=>`<tr><td>${esc(o.n)}</td><td class="r">${o.c}</td><td class="r">${o.gc?Math.round(o.g/o.gc)+" g":"—"}</td><td class="r"><span class="pill ${o.b/o.c>=.6?"p-good":o.b/o.c>=.3?"p-warn":"p-bad"}">${Math.round(o.b/o.c*100)}%</span></td></tr>`).join("")}</tbody></table></div></div>`:""}`;
  bindEvol();
}
function bindEvol(){$$("[data-n]").forEach(b=>b.onclick=()=>{S.evolN=+b.dataset.n;render()})}

/* ---------- alimentos ---------- */
function renderAlim(){
  const groups={};Object.entries(CATALOGO).forEach(([g,l])=>groups[g]=l.slice());
  Object.values(S.alim).forEach(a=>{if(!a.nombre)return;const g=a.grupo||"Otros";groups[g]=groups[g]||[];if(!groups[g].includes(a.nombre))groups[g].push(a.nombre)});
  const all=Object.values(groups).flat();
  const st=n=>{const s=foodState(n);return s==="probado?"?"prueba":s};
  const cnt={probado:0,prueba:0,pendiente:0,reaccion:0};all.forEach(n=>cnt[st(n)]++);
  const today=dayKey(new Date());
  const enPrueba=all.filter(n=>st(n)==="prueba").map(n=>{const a=S.alim[slug(n)]||{};const d=a.inicio?Math.floor((fromKey(today)-fromKey(a.inicio))/864e5)+1:1;
    return `<div class="fz"><div><div style="font-weight:700">${esc(n)}</div><div class="small muted">${d>3?"Ya han pasado 3 días: márcalo como probado si todo fue bien":"Día "+d+" de 3 · empezó "+fmtDay(a.inicio||today)}</div></div><button class="btn ghost" data-ok="${esc(n)}" style="padding:8px 12px">Todo bien</button></div>`}).join("");
  $("#v-alim").innerHTML=`
   <div class="stats">
    <div class="stat"><div class="k">Probados</div><div class="v">${cnt.probado}</div></div>
    <div class="stat"><div class="k">En prueba</div><div class="v">${cnt.prueba}</div></div>
    <div class="stat"><div class="k">Por probar</div><div class="v">${cnt.pendiente}</div></div>
   </div>
   ${enPrueba?`<div class="card freezer"><div class="sec-h"><h2>Vigilando ahora</h2></div><div class="small muted">Urticaria, vómitos o diarrea en estos días: márcalo como reacción.</div><div style="margin-top:6px">${enPrueba}</div></div>`:""}
   ${Object.entries(groups).map(([g,l])=>`<div class="card"><div class="sec-h"><h2>${esc(g)}</h2><span class="small muted num">${l.filter(n=>st(n)==="probado").length}/${l.length}</span></div>
     <div class="fgrid" style="margin-top:10px">${l.map(n=>{const s=st(n);return `<button class="food ${s}" data-food="${esc(n)}">${esc(n)}${s==="probado"?'<span class="mk">✓</span>':s==="prueba"?'<span class="mk">3d</span>':s==="reaccion"?'<span class="mk">!</span>':""}</button>`}).join("")}</div></div>`).join("")}
   <form class="card form" id="addFood"><div class="field"><label for="afN">Añadir otro alimento</label><div class="row2"><input class="inp" id="afN" placeholder="Ej. Lenteja pardina"><select class="inp" id="afG">${Object.keys(CATALOGO).map(g=>`<option>${g}</option>`).join("")}</select></div></div><button class="btn ghost" type="submit">Añadir</button></form>
   <div class="card"><div class="sec-h"><h2>Por ahora, no</h2></div><ul class="small" style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
    <li>Espinacas, acelgas y borraja: no antes de los 12 meses (nitratos).</li>
    <li>Miel y sal: no antes del año.</li>
    <li>Arándanos y uvas enteros: siempre aplastados o triturados.</li>
    <li>Leche de vaca como bebida: no antes del año (sí en yogur o para cocinar).</li></ul></div>`;
  $$("[data-food]").forEach(b=>b.onclick=()=>openFood(b.dataset.food));
  $$("[data-ok]").forEach(b=>b.onclick=()=>setFood(b.dataset.ok,"probado"));
  $("#addFood").onsubmit=async ev=>{ev.preventDefault();const n=$("#afN").value.trim();if(!n||!S.db)return;
    try{await S.db.doc("alimentos/"+slug(n)).set({nombre:n,grupo:$("#afG").value,estado:"pendiente",inicio:"",notas:""});toast("Añadido")}catch(e){errToast(e)}};
}
function openFood(n){
  const a=S.alim[slug(n)]||{};const s=foodState(n);
  const uses=allRecetas().filter(r=>(r.al||[]).includes(n));
  const veces=S.reg.filter(e=>e.tipo==="solido"&&e.recetaId&&(recById(e.recetaId)||{al:[]}).al.includes(n)).length;

  $("#sheetBody").innerHTML=`<div class="sh-head"><h2>${esc(n)}</h2><button class="iconbtn" id="shClose" aria-label="Cerrar">✕</button></div>
   <div class="form">
    <div class="rd-meta"><span class="pill ${s==="probado"?"p-good":s==="reaccion"?"p-bad":s==="pendiente"?"p-plain":"p-warn"}">${s==="probado"?"Probado":s==="reaccion"?"Reacción":s==="pendiente"?"Por probar":"En prueba"}</span>${a.inicio?`<span class="pill p-plain">Desde ${fmtDay(a.inicio)}</span>`:""}${veces?`<span class="pill p-plain">${veces} tomas registradas</span>`:""}</div>
    <div class="seg" role="group" aria-label="Estado">${[["pendiente","Por probar"],["prueba","Empezar hoy"],["probado","Probado"],["reaccion","Reacción"]].map(([v,l])=>`<button type="button" data-set="${v}" aria-pressed="${(s==="probado?"?"prueba":s)===v}">${l}</button>`).join("")}</div>
    <div class="field"><label for="fdN">Notas</label><input class="inp" id="fdN" value="${esc(a.notas||"")}" placeholder="Ej. rojez alrededor de la boca"></div>
    <div class="actions"><button class="btn" id="fdSave">Guardar nota</button></div>
    ${uses.length?`<div><div class="eyebrow" style="margin-bottom:6px">Recetas con ${esc(n.toLowerCase())}</div><div class="rlist">${uses.map(rCard).join("")}</div></div>`:""}
   </div>`;
  $("#shClose").onclick=closeSheet;
  $$("[data-set]").forEach(b=>b.onclick=()=>setFood(n,b.dataset.set,$("#fdN").value).then(()=>closeSheet()));
  $("#fdSave").onclick=()=>setFood(n,s==="probado?"?"prueba":s,$("#fdN").value).then(()=>{toast("Nota guardada");closeSheet()});
  $$(".rc",$("#sheetBody")).forEach(b=>b.onclick=()=>openRecipe(b.dataset.id));
}
async function setFood(n,estado,notas){if(!S.db){toast("Inicia sesión para guardar");return}
  const a=S.alim[slug(n)]||{};
  const inicio=estado==="prueba"?(a.estado==="prueba"&&a.inicio?a.inicio:dayKey(new Date())):(a.inicio||"");
  try{await S.db.doc("alimentos/"+slug(n)).set({nombre:n,grupo:grupoDe(n),estado,inicio,notas:notas!=null?notas:(a.notas||"")})}catch(e){errToast(e)}}

/* ---------- conexión: Firebase (Auth + Firestore) ---------- */
const PROBADOS_INICIALES = {"Verduras":["Calabacín","Patata","Zanahoria","Judía verde","Boniato","Calabaza","Puerro","Guisantes","Brócoli"],"Frutas":["Plátano","Aguacate","Manzana","Pera"],"Proteínas":["Pollo","Cerdo","Ternera","Merluza","Salmón"],"Cereales y legumbres":["Avena","Lenteja roja"],"Otros":["AOVE"]};
const banner=t=>{const b=$("#statusBanner");b.textContent=t||"";b.hidden=!t};
let unsubs=[];
function unsubAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
async function seedIfEmpty(db){
  try{
    const c=await db.doc("config/bebe").get();
    if(c.exists)return;
    const b=db.batch();
    b.set(db.doc("config/bebe"),DEF_CFG);
    Object.entries(PROBADOS_INICIALES).forEach(([g,l])=>l.forEach(n=>b.set(db.doc("alimentos/"+slug(n)),{nombre:n,grupo:g,estado:"probado",inicio:"",notas:""})));
    await b.commit();
  }catch(e){}
}
function subscribe(db){
  unsubAll();
  const onErr=e=>{if(e&&e.code==="permission-denied")banner("Tu email no tiene acceso a los datos. Añádelo en las reglas de Firestore (ver README).")};
  const cutoff=Date.now()-120*864e5;
  unsubs.push(db.collection("registros").where("ts",">=",cutoff).orderBy("ts","asc").limit(1000).onSnapshot(s=>{S.reg=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},onErr));
  unsubs.push(db.collection("alimentos").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.alim=m;render()},onErr));
  unsubs.push(db.collection("recetas").onSnapshot(s=>{S.recDb=s.docs.map(d=>{const x=d.data();return {id:d.id,n:x.n,tipo:x.tipo,al:x.al||[],ingTxt:x.ingTxt,pasosTxt:x.pasosTxt,notasTxt:x.notasTxt,cong:!!x.cong}});render()},onErr));
  unsubs.push(db.collection("lotes").onSnapshot(s=>{S.lotes=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},onErr));
  unsubs.push(db.doc("config/bebe").onSnapshot(s=>{S.cfg=s.exists?s.data():{};render()},onErr));
}
(function init(){
  const cfgOk=window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/PEGA_AQUI/.test(window.FIREBASE_CONFIG.apiKey);
  if(!cfgOk||!window.firebase){$("#app").hidden=false;banner("Falta configurar Firebase: rellena config.js (ver README).");return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth(),db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth.onAuthStateChanged(async u=>{
    if(!u){unsubAll();S.db=null;S.me=null;S.reg=[];S.alim={};S.recDb=[];S.lotes=[];S.cfg={};
      $("#app").hidden=true;$("#login").hidden=false;return}
    S.me=u.email;S.db=db;banner("");
    $("#login").hidden=true;$("#app").hidden=false;
    render();
    await seedIfEmpty(db);
    subscribe(db);
  });
  $("#loginForm").onsubmit=async ev=>{ev.preventDefault();$("#lgErr").textContent="";$("#lgBtn").disabled=true;
    try{await auth.signInWithEmailAndPassword($("#lgE").value.trim(),$("#lgP").value)}
    catch(e){$("#lgErr").textContent=/password|credential|user-not-found/.test(e.code||"")?"Email o contraseña incorrectos.":e.code==="auth/too-many-requests"?"Demasiados intentos. Espera unos minutos.":"No se pudo entrar. Revisa la conexión."}
    $("#lgBtn").disabled=false};
})();

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
